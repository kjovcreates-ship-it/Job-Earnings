<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Earnings Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">

      <div class="auth-logo">EarningsTracker</div>
      <div class="auth-sub">Your personal earnings log</div>

      <label for="auth-email">Email</label>
      <input
        id="auth-email"
        type="email"
        placeholder="you@email.com"
        autocomplete="email"
      />

      <label for="auth-pass">Password</label>
      <input
        id="auth-pass"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
      />

      <div class="remember-row">
        <label class="remember-label">
          <input id="remember-me" type="checkbox" checked />
          <span>Stay logged in</span>
        </label>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <div class="auth-btns">
        <button class="btn-primary" id="btn-login">Log In</button>
        <button class="btn-secondary" id="btn-register">Register</button>
      </div>

    </div>
  </div>


  <!-- APP SCREEN -->
  <div id="app-screen">

    <header>

      <div class="header-logo">
        EarningsTracker
      </div>

      <div class="header-actions">

        <button
          class="btn-theme"
          id="btn-theme"
          type="button"
          title="Switch theme"
          aria-label="Switch theme"
        >
          ☀️
        </button>

        <button
          class="btn-logout"
          id="btn-logout"
        >
          Log out
        </button>

      </div>

    </header>


    <main>

      <!-- PAGE HEADING -->
      <div class="page-heading">

        <div>
          <h1>Earnings</h1>
          <p>Track payments from your clients.</p>
        </div>

      </div>


      <!-- SUMMARY -->
      <div class="summary-bar">

        <div class="sum-card">
          <div class="sum-label">Total Earnings</div>
          <div class="sum-value accent" id="sum-total">
            ₱0.00
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-label">Paid</div>
          <div class="sum-value green" id="sum-paid">
            ₱0.00
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-label">Pending</div>
          <div class="sum-value orange" id="sum-pend">
            ₱0.00
          </div>
        </div>

        <div class="sum-card">
          <div class="sum-label">Entries</div>
          <div class="sum-value" id="sum-count">
            0
          </div>
        </div>

      </div>


      <!-- CONTROLS -->
      <div class="controls">

        <select id="filter-company">
          <option value="">All clients</option>
        </select>

        <input
          type="month"
          id="filter-month"
        />

        <button
          class="btn-clear"
          id="btn-clear-filter"
        >
          Clear
        </button>

        <div class="control-spacer"></div>

        <button
          class="btn-client"
          id="btn-open-client"
        >
          + Client
        </button>

        <button
          class="btn-add"
          id="btn-open-add"
        >
          + Add Earning
        </button>

      </div>


      <!-- TABS -->
      <div class="tabs">

        <button
          class="tab-btn active"
          data-tab="all"
        >
          All
        </button>

        <button
          class="tab-btn"
          data-tab="company"
        >
          By Client
        </button>

        <button
          class="tab-btn"
          data-tab="month"
        >
          By Month
        </button>

      </div>


      <!-- EARNINGS LIST -->
      <div id="earnings-list"></div>

    </main>

  </div>


  <!-- ADD / EDIT EARNING MODAL -->
  <div id="modal">

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="modal-title">
          Add Earning
        </h2>

        <button
          class="btn-close"
          id="btn-close-modal"
          type="button"
        >
          ✕
        </button>

      </div>


      <div class="form-grid">

        <div class="field full">

          <label for="f-company">
            Client
          </label>

          <select id="f-company">
            <option value="">
              Select a client
            </option>
          </select>

          <div class="client-helper">

            Don't see the client?

            <button
              type="button"
              id="btn-add-client-from-earning"
            >
              Add new client
            </button>

          </div>

        </div>


        <div class="field">

          <label for="f-date">
            Date
          </label>

          <input
            id="f-date"
            type="date"
          />

        </div>


        <div class="field">

          <label for="f-amount">
            Amount (₱)
          </label>

          <input
            id="f-amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
          />

        </div>


        <div class="field full">

          <label for="f-status">
            Payment Status
          </label>

          <select id="f-status">

            <option value="paid">
              Paid
            </option>

            <option value="pending">
              Pending
            </option>

          </select>

        </div>


        <div class="field full">

          <label for="f-notes">
            Notes (optional)
          </label>

          <textarea
            id="f-notes"
            rows="3"
            placeholder="e.g. Project name, invoice number…"
          ></textarea>

        </div>

      </div>


      <div class="modal-footer">

        <button
          class="btn-secondary"
          id="btn-cancel-modal"
        >
          Cancel
        </button>

        <button
          class="btn-primary"
          id="btn-save"
        >
          Save
        </button>

      </div>

    </div>

  </div>


  <!-- ADD CLIENT MODAL -->
  <div id="client-modal">

    <div class="modal-card client-modal-card">

      <div class="modal-header">

        <div>

          <h2>Add Client</h2>

          <p class="modal-sub">
            Save a client so you can select them next time.
          </p>

        </div>


        <button
          class="btn-close"
          id="btn-close-client"
          type="button"
        >
          ✕
        </button>

      </div>


      <div class="field">

        <label for="f-client-name">
          Client / Company Name
        </label>

        <input
          id="f-client-name"
          type="text"
          placeholder="e.g. Michelle / EmpowerHUB"
          autocomplete="off"
        />

      </div>


      <div class="modal-footer">

        <button
          class="btn-secondary"
          id="btn-cancel-client"
        >
          Cancel
        </button>

        <button
          class="btn-primary"
          id="btn-save-client"
        >
          Add Client
        </button>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
